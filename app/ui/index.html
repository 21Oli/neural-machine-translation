<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NMT — Neural Machine Translation</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f5f7fa;
      color: #1a1a2e;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem 1rem;
    }

    header {
      text-align: center;
      margin-bottom: 2.5rem;
    }
    header h1 { font-size: 2rem; font-weight: 700; color: #2d3748; }
    header p  { color: #718096; margin-top: 0.4rem; font-size: 0.95rem; }

    .card {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
      padding: 2rem;
      width: 100%;
      max-width: 720px;
    }

    .fields {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.25rem;
    }
    @media (max-width: 560px) { .fields { grid-template-columns: 1fr; } }

    .field label {
      display: block;
      font-size: 0.8rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #4a5568;
      margin-bottom: 0.5rem;
    }
    .field textarea {
      width: 100%;
      height: 160px;
      padding: 0.75rem;
      border: 1.5px solid #e2e8f0;
      border-radius: 8px;
      font-size: 0.95rem;
      resize: vertical;
      transition: border-color 0.2s;
      font-family: inherit;
    }
    .field textarea:focus {
      outline: none;
      border-color: #667eea;
    }
    #output {
      background: #f7fafc;
      color: #2d3748;
    }

    .actions {
      margin-top: 1.25rem;
      display: flex;
      gap: 0.75rem;
      align-items: center;
      flex-wrap: wrap;
    }

    button {
      padding: 0.6rem 1.4rem;
      border: none;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }
    button:active { transform: scale(0.97); }

    #btn-translate {
      background: #667eea;
      color: #fff;
    }
    #btn-translate:hover { background: #5a67d8; }
    #btn-translate:disabled { background: #a0aec0; cursor: not-allowed; }

    #btn-attention {
      background: #e2e8f0;
      color: #4a5568;
    }
    #btn-attention:hover { background: #cbd5e0; }

    #btn-clear {
      background: transparent;
      color: #a0aec0;
      border: 1.5px solid #e2e8f0;
    }
    #btn-clear:hover { color: #718096; }

    #status {
      font-size: 0.85rem;
      color: #718096;
      margin-left: auto;
    }
    #status.error { color: #e53e3e; }
    #status.ok    { color: #38a169; }

    /* Attention heatmap */
    #attention-section {
      margin-top: 1.5rem;
      display: none;
    }
    #attention-section h3 {
      font-size: 0.9rem;
      font-weight: 600;
      color: #4a5568;
      margin-bottom: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    #heatmap-container {
      overflow-x: auto;
    }
    #heatmap-canvas {
      display: block;
    }

    footer {
      margin-top: 2.5rem;
      font-size: 0.8rem;
      color: #a0aec0;
    }
  </style>
</head>
<body>

<header>
  <h1>Neural Machine Translation</h1>
  <p>English → Amharic translation with attention visualization</p>
</header>

<div class="card">
  <div class="fields">
    <div class="field">
      <label for="input">Source (English)</label>
      <textarea id="input" placeholder="Enter English text here…" spellcheck="false"></textarea>
    </div>
    <div class="field">
      <label for="output">Translation (Amharic)</label>
      <textarea id="output" placeholder="Translation will appear here…" readonly></textarea>
    </div>
  </div>

  <div class="actions">
    <button id="btn-translate">Translate</button>
    <button id="btn-attention">Show Attention</button>
    <button id="btn-clear">Clear</button>
    <span id="status"></span>
  </div>

  <div id="attention-section">
    <h3>Attention Heatmap</h3>
    <div id="heatmap-container">
      <canvas id="heatmap-canvas"></canvas>
    </div>
  </div>
</div>

<footer>NMT &copy; 2026</footer>

<script>
  const API_BASE = window.location.origin.replace(/:\d+$/, ':5000');

  const inputEl   = document.getElementById('input');
  const outputEl  = document.getElementById('output');
  const statusEl  = document.getElementById('status');
  const btnTrans  = document.getElementById('btn-translate');
  const btnAttn   = document.getElementById('btn-attention');
  const btnClear  = document.getElementById('btn-clear');
  const attnSect  = document.getElementById('attention-section');
  const canvas    = document.getElementById('heatmap-canvas');

  function setStatus(msg, type = '') {
    statusEl.textContent = msg;
    statusEl.className = type;
  }

  async function callTranslate(endpoint) {
    const text = inputEl.value.trim();
    if (!text) { setStatus('Please enter some text.', 'error'); return null; }

    setStatus('Translating…');
    btnTrans.disabled = true;
    btnAttn.disabled  = true;

    try {
      const res = await fetch(`${API_BASE}${endpoint}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ text }),
      });
      const data = await res.json();
      if (!res.ok) { throw new Error(data.error || 'Server error'); }
      setStatus('Done', 'ok');
      return data;
    } catch (err) {
      setStatus(err.message, 'error');
      return null;
    } finally {
      btnTrans.disabled = false;
      btnAttn.disabled  = false;
    }
  }

  btnTrans.addEventListener('click', async () => {
    attnSect.style.display = 'none';
    const data = await callTranslate('/translate');
    if (data) outputEl.value = data.translation;
  });

  btnAttn.addEventListener('click', async () => {
    const data = await callTranslate('/translate/attention');
    if (!data) return;
    outputEl.value = data.translation;

    if (data.attention && data.attention.length > 0) {
      const srcTokens = inputEl.value.trim().split(/\s+/);
      const tgtTokens = data.translation.split(/\s+/);
      drawHeatmap(data.attention, srcTokens, tgtTokens);
      attnSect.style.display = 'block';
    } else {
      attnSect.style.display = 'none';
    }
  });

  btnClear.addEventListener('click', () => {
    inputEl.value = '';
    outputEl.value = '';
    attnSect.style.display = 'none';
    setStatus('');
  });

  /**
   * Render an attention weight matrix as a heatmap on the canvas.
   * @param {number[][]} matrix - shape (tgtLen, srcLen)
   * @param {string[]}   srcTokens
   * @param {string[]}   tgtTokens
   */
  function drawHeatmap(matrix, srcTokens, tgtTokens) {
    const cellSize = 40;
    const padLeft  = 120;
    const padTop   = 80;
    const rows = matrix.length;
    const cols = matrix[0].length;

    canvas.width  = padLeft + cols * cellSize + 20;
    canvas.height = padTop  + rows * cellSize + 20;

    const ctx = canvas.getContext('2d');
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // Draw cells
    for (let r = 0; r < rows; r++) {
      for (let c = 0; c < cols; c++) {
        const val = Math.min(1, Math.max(0, matrix[r][c]));
        const intensity = Math.round((1 - val) * 255);
        ctx.fillStyle = `rgb(${intensity}, ${Math.round(intensity * 0.6)}, 255)`;
        ctx.fillRect(padLeft + c * cellSize, padTop + r * cellSize, cellSize - 1, cellSize - 1);
      }
    }

    // Source tokens (x-axis, top)
    ctx.fillStyle = '#4a5568';
    ctx.font = '11px system-ui, sans-serif';
    ctx.textAlign = 'center';
    for (let c = 0; c < cols; c++) {
      const label = srcTokens[c] || '';
      ctx.save();
      ctx.translate(padLeft + c * cellSize + cellSize / 2, padTop - 8);
      ctx.rotate(-Math.PI / 4);
      ctx.fillText(label.substring(0, 10), 0, 0);
      ctx.restore();
    }

    // Target tokens (y-axis, left)
    ctx.textAlign = 'right';
    for (let r = 0; r < rows; r++) {
      const label = tgtTokens[r] || '';
      ctx.fillText(
        label.substring(0, 14),
        padLeft - 6,
        padTop + r * cellSize + cellSize / 2 + 4
      );
    }
  }
</script>
</body>
</html>
